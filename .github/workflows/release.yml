name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to use for the rehearsal artifact set"
        required: true
        default: "v0.1.0-rehearsal"
        type: string
      rehearsal:
        description: "Skip GitHub Release publication and only run the release rehearsal"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: 0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal || false }}
  OIDC_IDENTITY_REGEX: ${{ github.event_name == 'workflow_dispatch' && format('https://github.com/olyxlabs/olyx-cli/.github/workflows/release.yml@{0}', github.ref) || 'https://github.com/olyxlabs/olyx-cli/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' }}
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v5
        with:
          path: release-workspace/olyx-cli
          persist-credentials: false

      - name: Validate release configuration
        working-directory: release-workspace/olyx-cli
        shell: bash
        env:
          OLYX_CORE_REPOSITORY: ${{ vars.OLYX_CORE_REPOSITORY }}
          OLYX_CORE_REPO_TOKEN: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "could not resolve CLI version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${REHEARSAL}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v${version}(-rehearsal)?$ ]]; then
              echo "rehearsal tag ${RELEASE_TAG} must match v${version} or v${version}-rehearsal" >&2
              exit 1
            fi
          else
            if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
              echo "tag ${RELEASE_TAG} does not match Cargo.toml version v${version}" >&2
              exit 1
            fi
          fi
          if [[ -z "${OLYX_CORE_REPOSITORY}" ]]; then
            echo "OLYX_CORE_REPOSITORY must be configured as a GitHub Actions variable" >&2
            exit 1
          fi
          if [[ -z "${OLYX_CORE_REPO_TOKEN}" ]]; then
            echo "OLYX_CORE_REPO_TOKEN must be configured as a GitHub Actions secret" >&2
            exit 1
          fi

      - name: Verify private core credentials
        shell: bash
        env:
          OLYX_CORE_REPOSITORY: ${{ vars.OLYX_CORE_REPOSITORY }}
          OLYX_CORE_REPO_TOKEN: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${OLYX_CORE_REPOSITORY}"
          response_file="$(mktemp)"
          http_status="$(curl -sS -o "${response_file}" -w '%{http_code}'             -H "Authorization: Bearer ${OLYX_CORE_REPO_TOKEN}"             -H "Accept: application/vnd.github+json"             "${repo_api}")"
          if [[ "${http_status}" != "200" ]]; then
            echo "OLYX_CORE_REPO_TOKEN cannot access ${OLYX_CORE_REPOSITORY}. Provide a valid token with read access to the private core repo." >&2
            cat "${response_file}" >&2
            exit 1
          fi
          rm -f "${response_file}"
      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.OLYX_CORE_REPOSITORY }}
          token: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
          path: release-workspace/Olyx-core
          persist-credentials: false

      - name: Create release workspace
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'TOML'
          [workspace]
          members = ["Olyx-core", "olyx-cli"]
          resolver = "2"

          [workspace.dependencies]
          aho-corasick = "1.1"
          regex = "1.10"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          olyx-core = { path = "Olyx-core" }

          [profile.release]
          codegen-units = 1
          lto = "thin"
          opt-level = "z"
          panic = "abort"
          debug = 0
          strip = "symbols"
          TOML

      - name: Generate lockfile
        working-directory: release-workspace
        run: cargo generate-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: release-workspace

      - name: Format CLI
        working-directory: release-workspace
        run: cargo fmt --package olyx-cli -- --check

      - name: Clippy
        working-directory: release-workspace
        run: cargo clippy --locked -p olyx-cli --all-targets -- -D warnings

      - name: Test
        working-directory: release-workspace
        run: cargo test --locked -p olyx-cli -p olyx-core

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout CLI
        uses: actions/checkout@v5
        with:
          path: release-workspace/olyx-cli
          persist-credentials: false

      - name: Verify private core credentials
        shell: bash
        env:
          OLYX_CORE_REPOSITORY: ${{ vars.OLYX_CORE_REPOSITORY }}
          OLYX_CORE_REPO_TOKEN: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${OLYX_CORE_REPOSITORY}"
          response_file="$(mktemp)"
          http_status="$(curl -sS -o "${response_file}" -w '%{http_code}'             -H "Authorization: Bearer ${OLYX_CORE_REPO_TOKEN}"             -H "Accept: application/vnd.github+json"             "${repo_api}")"
          if [[ "${http_status}" != "200" ]]; then
            echo "OLYX_CORE_REPO_TOKEN cannot access ${OLYX_CORE_REPOSITORY}. Provide a valid token with read access to the private core repo." >&2
            cat "${response_file}" >&2
            exit 1
          fi
          rm -f "${response_file}"
      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.OLYX_CORE_REPOSITORY }}
          token: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
          path: release-workspace/Olyx-core
          persist-credentials: false

      - name: Create release workspace
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'TOML'
          [workspace]
          members = ["Olyx-core", "olyx-cli"]
          resolver = "2"

          [workspace.dependencies]
          aho-corasick = "1.1"
          regex = "1.10"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          olyx-core = { path = "Olyx-core" }

          [profile.release]
          codegen-units = 1
          lto = "thin"
          opt-level = "z"
          panic = "abort"
          debug = 0
          strip = "symbols"
          TOML

      - name: Generate lockfile
        working-directory: release-workspace
        run: cargo generate-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: release-workspace

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REHEARSAL}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rehearsal)?$ ]]; then
              echo "rehearsal tags must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rehearsal" >&2
              exit 1
            fi
          else
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tags must match vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          fi

      - name: Build release binary
        working-directory: release-workspace
        run: cargo build --locked -p olyx-cli --bin olyx --release --target ${{ matrix.target }}

      - name: Smoke test release binary
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/olyx"
          "${binary}" --version | grep -E '^olyx [0-9]+\.[0-9]+\.[0-9]+$'
          "${binary}" help >/dev/null
          "${binary}" help trace >/dev/null
          "${binary}" inspect >/dev/null

      - name: Prepare signed artifact
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          asset="olyx-${version}-${{ matrix.target }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/olyx" "dist/${asset}/olyx"
          chmod 0755 "dist/${asset}/olyx"
          cat > "dist/${asset}/README.txt" <<EOF
          Olyx CLI ${version} for ${{ matrix.target }}

          Install:
            install -m 0755 olyx /usr/local/bin/olyx

          Verify this archive with the adjacent .sha256 file. Verify provenance with the adjacent
          Sigstore bundle:
            cosign verify-blob \
              --bundle ${asset}.tar.gz.bundle \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${asset}.tar.gz
          EOF
          find "dist/${asset}" -maxdepth 2 -type f | sort
          test ! -e "dist/${asset}/Olyx-core"
          test ! -e "dist/${asset}/src"
          test ! -e "dist/${asset}/Cargo.toml"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          shasum -a 256 "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          cosign sign-blob --yes \
            --bundle "dist/${asset}.tar.gz.bundle" \
            "dist/${asset}.tar.gz"
          rm -rf "dist/${asset}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-workspace/dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            release-workspace/dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.sha256
            release-workspace/dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.bundle

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "olyx-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
            "olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
          )
          for file in "${expected[@]}"; do
            test -s "dist/${file}"
            test -s "dist/${file}.sha256"
            test -s "dist/${file}.bundle"
            shasum -a 256 -c "dist/${file}.sha256"
            cosign verify-blob \
              --bundle "dist/${file}.bundle" \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "dist/${file}"
          done
          (
            cd dist
            shasum -a 256 *.tar.gz > SHA256SUMS.txt
          )

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          cat > dist/RELEASE_NOTES.md <<EOF
          ## Install

          Download the archive for your platform, verify its checksum, then install the \`olyx\` binary.

          - \`olyx-\${version}-x86_64-unknown-linux-gnu.tar.gz\`
          - \`olyx-\${version}-x86_64-apple-darwin.tar.gz\`
          - \`olyx-\${version}-aarch64-apple-darwin.tar.gz\`

          Each archive ships with:

          - a per-archive \`.sha256\` checksum file
          - a Sigstore \`.bundle\` file
          - a release-wide \`SHA256SUMS.txt\` manifest

          Verify a downloaded archive:

          \`\`\`sh
          asset="olyx-\${version}-x86_64-unknown-linux-gnu.tar.gz"
          shasum -a 256 -c "\${asset}.sha256"
          cosign verify-blob \\
            --bundle "\${asset}.bundle" \\
            --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            "\${asset}"
          tar -xzf "\${asset}"
          install -m 0755 "olyx-\${version}-x86_64-unknown-linux-gnu/olyx" /usr/local/bin/olyx
          \`\`\`
          EOF

      - name: Publish release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/SHA256SUMS.txt
            dist/olyx-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz
            dist/olyx-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/olyx-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz.bundle
            dist/olyx-${{ env.RELEASE_TAG }}-x86_64-apple-darwin.tar.gz
            dist/olyx-${{ env.RELEASE_TAG }}-x86_64-apple-darwin.tar.gz.sha256
            dist/olyx-${{ env.RELEASE_TAG }}-x86_64-apple-darwin.tar.gz.bundle
            dist/olyx-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz
            dist/olyx-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz.sha256
            dist/olyx-${{ env.RELEASE_TAG }}-aarch64-apple-darwin.tar.gz.bundle
