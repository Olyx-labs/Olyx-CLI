name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to use for the rehearsal artifact set"
        required: true
        default: "v0.2.0-rehearsal"
        type: string
      rehearsal:
        description: "Skip GitHub Release publication and only run the release rehearsal"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: 0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal || false }}
  OIDC_IDENTITY_REGEX: ${{ github.event_name == 'workflow_dispatch' && format('https://github.com/Olyx-labs/Olyx-CLI/.github/workflows/release.yml@{0}', github.ref) || 'https://github.com/Olyx-labs/Olyx-CLI/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' }}
  RUSTFLAGS: -D warnings
  RUST_VERSION: "1.88"
  CARGO_DENY_VERSION: "0.19.8"
  COSIGN_VERSION: "2.4.3"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate release tag vs Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "could not resolve CLI version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${REHEARSAL}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v${version}(-rehearsal)?$ ]]; then
              echo "rehearsal tag ${RELEASE_TAG} must match v${version} or v${version}-rehearsal" >&2
              exit 1
            fi
          else
            if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
              echo "tag ${RELEASE_TAG} does not match Cargo.toml version v${version}" >&2
              exit 1
            fi
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "${RUST_VERSION}"


      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace


      - name: Install cargo-deny
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --quiet

      - name: Audit dependencies
        run: cargo deny --config deny.toml check advisories licenses bans sources

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            ext: ""
            archive_ext: tar.gz
            cross: true
            smoke_test: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            ext: ""
            archive_ext: tar.gz
            cross: true
            smoke_test: false
          - os: macos-15
            target: x86_64-apple-darwin
            ext: ""
            archive_ext: tar.gz
            cross: false
            smoke_test: false
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
            archive_ext: tar.gz
            cross: false
            smoke_test: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive_ext: zip
            cross: false
            smoke_test: true

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"
          rustup target add ${{ matrix.target }}



      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --version "0.2.5" --locked --quiet

      - name: Install cosign
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
                -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
              ;;
            macOS)
              arch=$(uname -m)
              [[ "${arch}" == "arm64" ]] && cosign_arch="arm64" || cosign_arch="amd64"
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-darwin-${cosign_arch}" \
                -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
              ;;
            Windows)
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-windows-amd64.exe" \
                -o "${RUNNER_TEMP}/cosign.exe"
              echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
              ;;
          esac

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REHEARSAL}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rehearsal)?$ ]]; then
              echo "rehearsal tags must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rehearsal" >&2
              exit 1
            fi
          else
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tags must match vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          fi

      - name: Build release binary
        shell: bash
        env:
          CARGO_CMD: ${{ matrix.cross == true && 'cross' || 'cargo' }}
        run: $CARGO_CMD build --locked --bin olyx --release --target ${{ matrix.target }}

      - name: Smoke test release binary
        if: matrix.smoke_test == true
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/olyx${{ matrix.ext }}"
          "${binary}" --version | grep -E '^olyx [0-9]+\.[0-9]+\.[0-9]+$'
          "${binary}" help >/dev/null
          "${binary}" help route >/dev/null
          "${binary}" help debug >/dev/null
          "${binary}" help replay >/dev/null
          "${binary}" check examples/olyx.json >/dev/null
          "${binary}" route --config examples/olyx.json --input examples/request.json --dry-run >/dev/null
          "${binary}" help trace >/dev/null
          "${binary}" help complete >/dev/null
          "${binary}" inspect >/dev/null
          python_cmd=$(command -v python3 || command -v python)
          "${python_cmd}" scripts/smoke-local.py "${binary}"

      - name: Prepare signed artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          asset="olyx-${version}-${{ matrix.target }}"
          archive_ext="${{ matrix.archive_ext }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/olyx${{ matrix.ext }}" "dist/${asset}/olyx${{ matrix.ext }}"
          cp LICENSE NOTICE README.md "dist/${asset}/"
          cp -R examples "dist/${asset}/examples"
          if [[ "${archive_ext}" != "zip" ]]; then
            chmod 0755 "dist/${asset}/olyx${{ matrix.ext }}"
          fi
          if [[ "${archive_ext}" == "zip" ]]; then
            cat > "dist/${asset}/README.txt" <<EOF
          Olyx CLI ${version} for ${{ matrix.target }}

          Install:
            Move olyx.exe to a directory on your PATH, e.g. %LOCALAPPDATA%\Microsoft\WindowsApps\

          Verify this archive with the adjacent .sha256 file. Verify provenance with the adjacent
          Sigstore bundle:
            cosign verify-blob \
              --bundle ${asset}.zip.bundle \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${asset}.zip
          EOF
          else
            cat > "dist/${asset}/README.txt" <<EOF
          Olyx CLI ${version} for ${{ matrix.target }}

          Install:
            install -m 0755 olyx /usr/local/bin/olyx

          Verify this archive with the adjacent .sha256 file. Verify provenance with the adjacent
          Sigstore bundle:
            cosign verify-blob \
              --bundle ${asset}.tar.gz.bundle \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${asset}.tar.gz
          EOF
          fi
          find "dist/${asset}" -maxdepth 2 -type f | sort
          test ! -e "dist/${asset}/src"
          test ! -e "dist/${asset}/Cargo.toml"
          if [[ "${archive_ext}" == "zip" ]]; then
            (cd dist && 7z a "${asset}.zip" "${asset}")
            (cd dist && sha256sum "${asset}.zip" > "${asset}.zip.sha256")
            cosign sign-blob --yes \
              --bundle "dist/${asset}.zip.bundle" \
              "dist/${asset}.zip"
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
            (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
            cosign sign-blob --yes \
              --bundle "dist/${asset}.tar.gz.bundle" \
              "dist/${asset}.tar.gz"
          fi
          python_cmd=$(command -v python3 || command -v python)
          "${python_cmd}" scripts/validate-archive.py "dist/${asset}.${archive_ext}"
          rm -rf "dist/${asset}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
            dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}.bundle

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          merge-multiple: true

      - name: Install cosign
        shell: bash
        run: |
          curl -sSfL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz"
            "olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz"
            "olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
            "olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
            "olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
          )
          for file in "${expected[@]}"; do
            test -s "dist/${file}"
            test -s "dist/${file}.sha256"
            test -s "dist/${file}.bundle"
            (cd dist && sha256sum -c "${file}.sha256")
            cosign verify-blob \
              --bundle "dist/${file}.bundle" \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "dist/${file}"
          done
          (
            cd dist
            sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          )

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          export version
          cat > dist/RELEASE_NOTES.md <<EOF
          ## Local routing, replay, and debugging

          This release adds standalone model routing with fallbacks, SQLite trace storage,
          live replay/comparison, and local debugging. Local commands need only your
          provider keys; no Olyx account or enterprise license is required.
          Example configuration and requests are included in every archive.

          ## Install

          Download the archive for your platform, verify its checksum, then install the \`olyx\` binary.

          | Platform | Archive |
          | :--- | :--- |
          | Linux x86_64 (static) | \`olyx-${version}-x86_64-unknown-linux-musl.tar.gz\` |
          | Linux arm64 (static) | \`olyx-${version}-aarch64-unknown-linux-musl.tar.gz\` |
          | macOS Apple Silicon | \`olyx-${version}-aarch64-apple-darwin.tar.gz\` |
          | macOS Intel | \`olyx-${version}-x86_64-apple-darwin.tar.gz\` |
          | Windows x86_64 | \`olyx-${version}-x86_64-pc-windows-msvc.zip\` |

          Each archive ships with a per-archive \`.sha256\` checksum file, a Sigstore \`.bundle\` file,
          and a release-wide \`SHA256SUMS.txt\` manifest. Linux binaries are fully static — no runtime
          dependencies required.

          **Linux / macOS:**

          \`\`\`sh
          asset="olyx-${version}-x86_64-unknown-linux-musl.tar.gz"
          sha256sum -c "\${asset}.sha256"
          cosign verify-blob \\
            --bundle "\${asset}.bundle" \\
            --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            "\${asset}"
          tar -xzf "\${asset}"
          install -m 0755 "olyx-${version}-x86_64-unknown-linux-musl/olyx" /usr/local/bin/olyx
          cd "olyx-${version}-x86_64-unknown-linux-musl"
          export OPENAI_API_KEY=your-provider-key
          olyx check examples/olyx.json
          olyx route --config examples/olyx.json --input examples/request.json
          \`\`\`

          **Windows (PowerShell):**

          \`\`\`powershell
          \$asset = "olyx-${version}-x86_64-pc-windows-msvc.zip"
          (Get-FileHash \$asset -Algorithm SHA256).Hash.ToLower() + "  " + \$asset |
            Compare-Object (Get-Content "\${asset}.sha256")
          Expand-Archive \$asset -DestinationPath .
          Move-Item "olyx-${version}-x86_64-pc-windows-msvc\\olyx.exe" "\$env:LOCALAPPDATA\\Microsoft\\WindowsApps\\olyx.exe"
          \`\`\`
          EOF

      - name: Publish release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            dist/SHA256SUMS.txt \
            "dist/olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip" \
            "dist/olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip.sha256" \
            "dist/olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip.bundle"
