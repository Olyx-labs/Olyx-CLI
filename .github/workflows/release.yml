name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: release-workspace/olyx-cli
          persist-credentials: false

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OLYX_CORE_REPOSITORY }}
          token: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
          path: release-workspace/Olyx-core
          persist-credentials: false

      - name: Create release workspace
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'TOML'
          [workspace]
          members = ["Olyx-core", "olyx-cli"]
          resolver = "2"

          [workspace.dependencies]
          aho-corasick = "1.1"
          regex = "1.10"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          olyx-core = { path = "Olyx-core" }

          [profile.release]
          codegen-units = 1
          lto = "thin"
          opt-level = "z"
          panic = "abort"
          strip = "symbols"
          TOML

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: release-workspace

      - name: Format CLI
        working-directory: release-workspace
        run: cargo fmt --package olyx-cli -- --check

      - name: Clippy
        working-directory: release-workspace
        run: cargo clippy -p olyx-cli --all-targets -- -D warnings

      - name: Test
        working-directory: release-workspace
        run: cargo test -p olyx-cli -p olyx-core

  build:
    name: Build ${{ matrix.asset_suffix }}
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            asset_suffix: darwin-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            asset_suffix: darwin-aarch64

    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: release-workspace/olyx-cli
          persist-credentials: false

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OLYX_CORE_REPOSITORY }}
          token: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
          path: release-workspace/Olyx-core
          persist-credentials: false

      - name: Create release workspace
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'TOML'
          [workspace]
          members = ["Olyx-core", "olyx-cli"]
          resolver = "2"

          [workspace.dependencies]
          aho-corasick = "1.1"
          regex = "1.10"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          olyx-core = { path = "Olyx-core" }

          [profile.release]
          codegen-units = 1
          lto = "thin"
          opt-level = "z"
          panic = "abort"
          strip = "symbols"
          TOML

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: release-workspace

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Build release binary
        working-directory: release-workspace
        run: cargo build -p olyx-cli --bin olyx --release --target ${{ matrix.target }}

      - name: Prepare signed artifact
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          asset="olyx-${version}-${{ matrix.asset_suffix }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/olyx" "dist/${asset}/olyx"
          chmod 0755 "dist/${asset}/olyx"
          cat > "dist/${asset}/README.txt" <<EOF
          Olyx CLI ${version} for ${{ matrix.target }}

          Install:
            install -m 0755 olyx /usr/local/bin/olyx

          Verify this archive with the adjacent .sha256 file. Verify provenance with the adjacent
          Sigstore certificate and signature:
            cosign verify-blob \
              --certificate ${asset}.tar.gz.pem \
              --signature ${asset}.tar.gz.sig \
              --certificate-identity-regexp 'https://github.com/olyxlabs/olyx-cli/.github/workflows/release.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${asset}.tar.gz
          EOF
          find "dist/${asset}" -maxdepth 2 -type f | sort
          test ! -e "dist/${asset}/Olyx-core"
          test ! -e "dist/${asset}/src"
          test ! -e "dist/${asset}/Cargo.toml"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          shasum -a 256 "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          cosign sign-blob --yes \
            --output-signature "dist/${asset}.tar.gz.sig" \
            --output-certificate "dist/${asset}.tar.gz.pem" \
            "dist/${asset}.tar.gz"
          rm -rf "dist/${asset}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: olyx-${{ github.ref_name }}-${{ matrix.asset_suffix }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-workspace/dist/olyx-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz
            release-workspace/dist/olyx-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz.sha256
            release-workspace/dist/olyx-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz.sig
            release-workspace/dist/olyx-${{ github.ref_name }}-${{ matrix.asset_suffix }}.tar.gz.pem

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "olyx-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
            "olyx-${GITHUB_REF_NAME}-darwin-x86_64.tar.gz"
            "olyx-${GITHUB_REF_NAME}-darwin-aarch64.tar.gz"
          )
          for file in "${expected[@]}"; do
            test -s "dist/${file}"
            test -s "dist/${file}.sha256"
            test -s "dist/${file}.sig"
            test -s "dist/${file}.pem"
            shasum -a 256 -c "dist/${file}.sha256"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/olyx-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/olyx-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            dist/olyx-${{ github.ref_name }}-linux-x86_64.tar.gz.sig
            dist/olyx-${{ github.ref_name }}-linux-x86_64.tar.gz.pem
            dist/olyx-${{ github.ref_name }}-darwin-x86_64.tar.gz
            dist/olyx-${{ github.ref_name }}-darwin-x86_64.tar.gz.sha256
            dist/olyx-${{ github.ref_name }}-darwin-x86_64.tar.gz.sig
            dist/olyx-${{ github.ref_name }}-darwin-x86_64.tar.gz.pem
            dist/olyx-${{ github.ref_name }}-darwin-aarch64.tar.gz
            dist/olyx-${{ github.ref_name }}-darwin-aarch64.tar.gz.sha256
            dist/olyx-${{ github.ref_name }}-darwin-aarch64.tar.gz.sig
            dist/olyx-${{ github.ref_name }}-darwin-aarch64.tar.gz.pem
