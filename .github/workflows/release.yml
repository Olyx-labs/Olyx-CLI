name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to use for the rehearsal artifact set"
        required: true
        default: "v0.1.0-rehearsal"
        type: string
      rehearsal:
        description: "Skip GitHub Release publication and only run the release rehearsal"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: 0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal || false }}
  OIDC_IDENTITY_REGEX: ${{ github.event_name == 'workflow_dispatch' && format('https://github.com/Olyx-labs/Olyx-CLI/.github/workflows/release.yml@{0}', github.ref) || 'https://github.com/Olyx-labs/Olyx-CLI/.github/workflows/release.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' }}
  RUSTFLAGS: -D warnings
  RUST_VERSION: "1.87"
  CARGO_DENY_VERSION: "0.16.4"
  COSIGN_VERSION: "2.4.3"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout CLI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: release-workspace/olyx-cli
          persist-credentials: false

      - name: Validate release configuration
        working-directory: release-workspace/olyx-cli
        shell: bash
        env:
          OLYX_CORE_REPOSITORY: ${{ vars.OLYX_CORE_REPOSITORY }}
          OLYX_CORE_REPO_TOKEN: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "could not resolve CLI version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${REHEARSAL}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v${version}(-rehearsal)?$ ]]; then
              echo "rehearsal tag ${RELEASE_TAG} must match v${version} or v${version}-rehearsal" >&2
              exit 1
            fi
          else
            if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
              echo "tag ${RELEASE_TAG} does not match Cargo.toml version v${version}" >&2
              exit 1
            fi
          fi
          if [[ -z "${OLYX_CORE_REPOSITORY}" ]]; then
            echo "OLYX_CORE_REPOSITORY must be configured as a GitHub Actions variable" >&2
            exit 1
          fi
          if [[ -z "${OLYX_CORE_REPO_TOKEN}" ]]; then
            echo "OLYX_CORE_REPO_TOKEN must be configured as a GitHub Actions secret" >&2
            exit 1
          fi

      - name: Verify private core credentials
        shell: bash
        env:
          OLYX_CORE_REPOSITORY: ${{ vars.OLYX_CORE_REPOSITORY }}
          OLYX_CORE_REPO_TOKEN: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${OLYX_CORE_REPOSITORY}"
          response_file="$(mktemp)"
          http_status="$(curl -sS -o "${response_file}" -w '%{http_code}' \
            -H "Authorization: Bearer ${OLYX_CORE_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${repo_api}")"
          if [[ "${http_status}" != "200" ]]; then
            echo "OLYX_CORE_REPO_TOKEN cannot access ${OLYX_CORE_REPOSITORY}. Provide a valid token with read access to the private core repo." >&2
            cat "${response_file}" >&2
            exit 1
          fi
          rm -f "${response_file}"

      - name: Checkout private core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.OLYX_CORE_REPOSITORY }}
          token: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
          path: release-workspace/Olyx-core
          persist-credentials: false

      - name: Create release workspace
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'TOML'
          [workspace]
          members = ["Olyx-core", "olyx-cli"]
          resolver = "2"

          [workspace.dependencies]
          aho-corasick = "1.1"
          regex = "1.10"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          olyx-core = { path = "Olyx-core" }

          [profile.release]
          codegen-units = 1
          lto = "thin"
          opt-level = "z"
          panic = "abort"
          debug = 0
          strip = "symbols"
          TOML

      - name: Generate lockfile
        working-directory: release-workspace
        run: cargo generate-lockfile

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "${RUST_VERSION}"

      - name: Cache Cargo
        uses: actions/cache@v4 # pin to commit SHA before shipping to production
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            release-workspace/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('release-workspace/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format CLI
        working-directory: release-workspace
        run: cargo fmt --package olyx-cli -- --check

      - name: Clippy
        working-directory: release-workspace
        run: cargo clippy --locked -p olyx-cli --all-targets -- -D warnings

      - name: Test
        working-directory: release-workspace
        run: cargo test --locked -p olyx-cli -p olyx-core

      - name: Cache cargo-deny
        uses: actions/cache@v4 # pin to commit SHA before shipping to production
        id: cache-cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --quiet

      - name: Audit dependencies
        working-directory: release-workspace
        run: cargo deny --config olyx-cli/deny.toml check advisories licenses bans sources

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            ext: ""
            archive_ext: tar.gz
            cross: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            ext: ""
            archive_ext: tar.gz
            cross: true
          - os: macos-15
            target: x86_64-apple-darwin
            ext: ""
            archive_ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
            archive_ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive_ext: zip

    steps:
      - name: Checkout CLI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: release-workspace/olyx-cli
          persist-credentials: false

      - name: Verify private core credentials
        shell: bash
        env:
          OLYX_CORE_REPOSITORY: ${{ vars.OLYX_CORE_REPOSITORY }}
          OLYX_CORE_REPO_TOKEN: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${OLYX_CORE_REPOSITORY}"
          response_file="$(mktemp)"
          http_status="$(curl -sS -o "${response_file}" -w '%{http_code}' \
            -H "Authorization: Bearer ${OLYX_CORE_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${repo_api}")"
          if [[ "${http_status}" != "200" ]]; then
            echo "OLYX_CORE_REPO_TOKEN cannot access ${OLYX_CORE_REPOSITORY}. Provide a valid token with read access to the private core repo." >&2
            cat "${response_file}" >&2
            exit 1
          fi
          rm -f "${response_file}"

      - name: Checkout private core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.OLYX_CORE_REPOSITORY }}
          token: ${{ secrets.OLYX_CORE_REPO_TOKEN }}
          path: release-workspace/Olyx-core
          persist-credentials: false

      - name: Create release workspace
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          cat > Cargo.toml <<'TOML'
          [workspace]
          members = ["Olyx-core", "olyx-cli"]
          resolver = "2"

          [workspace.dependencies]
          aho-corasick = "1.1"
          regex = "1.10"
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          olyx-core = { path = "Olyx-core" }

          [profile.release]
          codegen-units = 1
          lto = "thin"
          opt-level = "z"
          panic = "abort"
          debug = 0
          strip = "symbols"
          TOML

      - name: Generate lockfile
        working-directory: release-workspace
        run: cargo generate-lockfile

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4 # pin to commit SHA before shipping to production
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            release-workspace/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('release-workspace/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Cache cross
        if: matrix.cross == true
        uses: actions/cache@v4 # pin to commit SHA before shipping to production
        id: cache-cross
        with:
          path: ~/.cargo/bin/cross
          key: cross-0.2.5

      - name: Install cross
        if: matrix.cross == true && steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --version "0.2.5" --locked --quiet

      - name: Install cosign
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
                -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
              ;;
            macOS)
              arch=$(uname -m)
              [[ "${arch}" == "arm64" ]] && cosign_arch="arm64" || cosign_arch="amd64"
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-darwin-${cosign_arch}" \
                -o /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
              ;;
            Windows)
              curl -sSfL \
                "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-windows-amd64.exe" \
                -o "${RUNNER_TEMP}/cosign.exe"
              echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
              ;;
          esac

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REHEARSAL}" == "true" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rehearsal)?$ ]]; then
              echo "rehearsal tags must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rehearsal" >&2
              exit 1
            fi
          else
            if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release tags must match vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          fi

      - name: Build release binary
        working-directory: release-workspace
        env:
          CARGO_CMD: ${{ matrix.cross == true && 'cross' || 'cargo' }}
        run: $CARGO_CMD build --locked -p olyx-cli --bin olyx --release --target ${{ matrix.target }}

      - name: Smoke test release binary
        if: matrix.target != 'aarch64-unknown-linux-musl'
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/olyx${{ matrix.ext }}"
          "${binary}" --version | grep -E '^olyx [0-9]+\.[0-9]+\.[0-9]+$'
          "${binary}" help >/dev/null
          "${binary}" help trace >/dev/null
          "${binary}" inspect >/dev/null

      - name: Prepare signed artifact
        working-directory: release-workspace
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          asset="olyx-${version}-${{ matrix.target }}"
          archive_ext="${{ matrix.archive_ext }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/olyx${{ matrix.ext }}" "dist/${asset}/olyx${{ matrix.ext }}"
          if [[ "${archive_ext}" != "zip" ]]; then
            chmod 0755 "dist/${asset}/olyx${{ matrix.ext }}"
          fi
          if [[ "${archive_ext}" == "zip" ]]; then
            cat > "dist/${asset}/README.txt" <<EOF
          Olyx CLI ${version} for ${{ matrix.target }}

          Install:
            Move olyx.exe to a directory on your PATH, e.g. %LOCALAPPDATA%\Microsoft\WindowsApps\

          Verify this archive with the adjacent .sha256 file. Verify provenance with the adjacent
          Sigstore bundle:
            cosign verify-blob \
              --bundle ${asset}.zip.bundle \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${asset}.zip
          EOF
          else
            cat > "dist/${asset}/README.txt" <<EOF
          Olyx CLI ${version} for ${{ matrix.target }}

          Install:
            install -m 0755 olyx /usr/local/bin/olyx

          Verify this archive with the adjacent .sha256 file. Verify provenance with the adjacent
          Sigstore bundle:
            cosign verify-blob \
              --bundle ${asset}.tar.gz.bundle \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${asset}.tar.gz
          EOF
          fi
          find "dist/${asset}" -maxdepth 2 -type f | sort
          test ! -e "dist/${asset}/Olyx-core"
          test ! -e "dist/${asset}/src"
          test ! -e "dist/${asset}/Cargo.toml"
          if [[ "${archive_ext}" == "zip" ]]; then
            (cd dist && 7z a "${asset}.zip" "${asset}")
            sha256sum "dist/${asset}.zip" > "dist/${asset}.zip.sha256"
            cosign sign-blob --yes \
              --bundle "dist/${asset}.zip.bundle" \
              "dist/${asset}.zip"
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
            shasum -a 256 "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
            cosign sign-blob --yes \
              --bundle "dist/${asset}.tar.gz.bundle" \
              "dist/${asset}.tar.gz"
          fi
          rm -rf "dist/${asset}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-workspace/dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            release-workspace/dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
            release-workspace/dist/olyx-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}.bundle

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          merge-multiple: true

      - name: Install cosign
        shell: bash
        run: |
          curl -sSfL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz"
            "olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz"
            "olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
            "olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
            "olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
          )
          for file in "${expected[@]}"; do
            test -s "dist/${file}"
            test -s "dist/${file}.sha256"
            test -s "dist/${file}.bundle"
            sha256sum -c "dist/${file}.sha256"
            cosign verify-blob \
              --bundle "dist/${file}.bundle" \
              --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "dist/${file}"
          done
          (
            cd dist
            sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          )

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          cat > dist/RELEASE_NOTES.md <<EOF
          ## Install

          Download the archive for your platform, verify its checksum, then install the \`olyx\` binary.

          | Platform | Archive |
          | :--- | :--- |
          | Linux x86_64 (static) | \`olyx-\${version}-x86_64-unknown-linux-musl.tar.gz\` |
          | Linux arm64 (static) | \`olyx-\${version}-aarch64-unknown-linux-musl.tar.gz\` |
          | macOS Apple Silicon | \`olyx-\${version}-aarch64-apple-darwin.tar.gz\` |
          | macOS Intel | \`olyx-\${version}-x86_64-apple-darwin.tar.gz\` |
          | Windows x86_64 | \`olyx-\${version}-x86_64-pc-windows-msvc.zip\` |

          Each archive ships with a per-archive \`.sha256\` checksum file, a Sigstore \`.bundle\` file,
          and a release-wide \`SHA256SUMS.txt\` manifest. Linux binaries are fully static — no runtime
          dependencies required.

          **Linux / macOS:**

          \`\`\`sh
          asset="olyx-\${version}-x86_64-unknown-linux-musl.tar.gz"
          sha256sum -c "\${asset}.sha256"
          cosign verify-blob \\
            --bundle "\${asset}.bundle" \\
            --certificate-identity-regexp "${OIDC_IDENTITY_REGEX}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            "\${asset}"
          tar -xzf "\${asset}"
          install -m 0755 "olyx-\${version}-x86_64-unknown-linux-musl/olyx" /usr/local/bin/olyx
          \`\`\`

          **Windows (PowerShell):**

          \`\`\`powershell
          \$asset = "olyx-\${version}-x86_64-pc-windows-msvc.zip"
          (Get-FileHash \$asset -Algorithm SHA256).Hash.ToLower() + "  " + \$asset |
            Compare-Object (Get-Content "\${asset}.sha256")
          Expand-Archive \$asset -DestinationPath .
          Move-Item "olyx-\${version}-x86_64-pc-windows-msvc\\olyx.exe" "\$env:LOCALAPPDATA\\Microsoft\\WindowsApps\\olyx.exe"
          \`\`\`
          EOF

      - name: Publish release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            dist/SHA256SUMS.txt \
            "dist/olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "dist/olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz.sha256" \
            "dist/olyx-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz.bundle" \
            "dist/olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip" \
            "dist/olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip.sha256" \
            "dist/olyx-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip.bundle"
