name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_VERSION: "1.88"
  CARGO_DENY_VERSION: "0.19.8"

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: npm launcher checks
        run: node --test npm/launcher.test.cjs

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "${RUST_VERSION}"


      - name: Verify public package boundary
        run: python3 scripts/verify-public-boundary.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Account-free provider checks
        run: python3 scripts/test-providers

      - name: Install cargo-deny
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --quiet

      - name: Audit dependencies
        run: cargo deny check --config deny.toml advisories licenses bans sources

  container:
    name: Build container
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - run: docker build -t olyx:test .
      - run: docker run --rm olyx:test check /etc/olyx/olyx.json
      - run: python3 scripts/smoke-container.py olyx:test
