name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_VERSION: "1.88"
  CARGO_DENY_VERSION: "0.19.8"

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "${RUST_VERSION}"


      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace


      - name: Build and smoke test the public CLI
        run: |
          cargo build --locked --bin olyx
          python3 scripts/smoke-local.py target/debug/olyx

      - name: Install cargo-deny
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          cargo +stable install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --quiet

      - name: Audit dependencies
        run: cargo deny check --config deny.toml advisories licenses bans sources
