name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_VERSION: "1.88"
  CARGO_DENY_VERSION: "0.19.8"

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "${RUST_VERSION}"


      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked


      - name: Install cargo-deny
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --quiet

      - name: Audit dependencies
        run: cargo deny check --config deny.toml advisories licenses bans sources
