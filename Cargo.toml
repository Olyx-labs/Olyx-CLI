[package]
name = "olyx-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Standalone model routing, replay, debugging, and an application HTTP endpoint"
authors = ["Olyx Labs <hello@olyxai.io>"]
license = "Apache-2.0"
publish = false
homepage = "https://olyxai.io"
repository = "https://github.com/Olyx-labs/Olyx-CLI"
readme = "README.md"
keywords = ["ai", "llm", "tracing", "observability", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oy"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
debug = 0
strip = "symbols"

[dependencies]
olyx-local-runtime = { path = "runtime" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[workspace]
members = ["runtime"]
resolver = "2"
