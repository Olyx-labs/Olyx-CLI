[package]
name = "olyx-cli"
version = "0.1.0"
edition = "2021"
description = "Olyx command-line client for local execution and enterprise agent workflows"
license = "Apache-2.0"
homepage = "https://olyxai.io"
repository = "https://github.com/Olyx-labs/Olyx-CLI"

[[bin]]
name = "olyx"
path = "src/main.rs"

[dependencies]
olyx-core = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

