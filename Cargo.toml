[package]
name = "olyx-cli"
version = "0.1.0"
edition = "2024"
description = "Olyx command-line client for local execution and enterprise agent workflows"
license = "Apache-2.0"

[dependencies]
olyx-core = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
