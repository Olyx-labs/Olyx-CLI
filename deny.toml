[graph]
# Only audit deps that are actually reachable in the final binary.
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-musl" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# Deny any crate with an unpatched security advisory.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
version = 2
# Allowed SPDX identifiers. Any unlisted license is an error.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
# Confidence threshold for license text matching.
confidence-threshold = 0.8

[bans]
# Warn about duplicate versions for review.
multiple-versions = "warn"
# Explicit crate bans; yanked crates are checked under advisories.
deny = []
# Allow multiple versions of crates where the ecosystem commonly ships both.
skip = []

[sources]
# Only allow dependencies from crates.io and the local workspace path.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
